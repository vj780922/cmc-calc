<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BD_C23配比計算機 - SJ</title>
    <style>
        /* 字型設定：英文 Calibri, 中文 微軟正黑體 */
        body {
            font-family: "Calibri", "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f9;
            color: #2d3748;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #1a365d;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .section-label {
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
            color: #3182ce;
            border-left: 4px solid #3182ce;
            padding-left: 10px;
            font-size: 16px;
        }

        .input-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .input-group label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
            display: block;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #3182ce;
            background-color: #fcfcfc;
        }

        .single-input-group {
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-calc {
            flex: 2;
            padding: 15px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-calc:hover { background-color: #2c5282; }

        .btn-reset {
            flex: 1;
            padding: 15px;
            background-color: #718096;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover { background-color: #4a5568; }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 12px;
            border: 1px solid #bee3f8;
            display: none;
            animation: fadeIn 0.4s;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .final-val {
            font-size: 20px;
            font-weight: bold;
            color: #2b6cb0;
            border-top: 2px dashed #90cdf4;
            padding-top: 15px;
            margin-top: 15px;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .final-val span:last-child {
            font-size: 32px;
            color: #d93025;
            display: block;
            margin-top: 5px;
        }

        .footer-info {
            text-align: center;
            font-size: 13px;
            color: #718096;
            line-height: 2;
        }

        .visit-badge {
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #4a5568;
            margin-left: 5px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>BD_C23配比計算機</h2>

        <span class="section-label">CMC 粉材固含量 (%)</span>
        <div class="input-row">
            <div class="input-group">
                <label>第 1 筆</label>
                <input type="number" id="sc1" step="0.01" placeholder="0.00" onfocus="this.select()">
            </div>
            <div class="input-group">
                <label>第 2 筆</label>
                <input type="number" id="sc2" step="0.01" placeholder="0.00" onfocus="this.select()">
            </div>
            <div class="input-group">
                <label>第 3 筆</label>
                <input type="number" id="sc3" step="0.01" placeholder="0.00" onfocus="this.select()">
            </div>
        </div>

        <div class="single-input-group">
            <span class="section-label">總重量 (Kg)</span>
            <input type="number" id="totalWeight" value="10" step="0.1" onfocus="this.select()">
        </div>

        <div class="single-input-group">
            <span class="section-label">BD_C23 目標比例 (%)</span>
            <input type="number" id="targetRatio" value="2.3" step="0.1" onfocus="this.select()">
        </div>

        <div class="btn-group">
            <button class="btn-calc" onclick="calculate()">執行計算</button>
            <button class="btn-reset" onclick="resetForm()">清除</button>
        </div>

        <div id="resultBox" class="result-area">
            <div class="result-line">
                <span>平均固含量：</span>
                <span id="avgSolid">-</span>
            </div>
            <div class="result-line final-val">
                <span>添加 CMC 粉材重量</span>
                <span id="outputPowder">0.0000 kg</span>
            </div>
            <div class="result-line final-val">
                <span>添加 RO 水重量</span>
                <span id="outputWater">0.0000 kg</span>
            </div>
        </div>
    </div>

    <div class="footer-info">
        <div>作者：SJ | 版本：v1.6.1 | 最後更新日期：2026/05/18</div>
        <div>拜訪次數：<span class="visit-badge" id="visitCount">0</span></div>
    </div>
</div>

<script>
    window.onload = function() {
        let count = localStorage.getItem('sj_bdc23_visits') || 0;
        count = parseInt(count) + 1;
        localStorage.setItem('sj_bdc23_visits', count);
        document.getElementById('visitCount').innerText = count;
    };

    function calculate() {
        const v1 = parseFloat(document.getElementById('sc1').value);
        const v2 = parseFloat(document.getElementById('sc2').value);
        const v3 = parseFloat(document.getElementById('sc3').value);
        const tWeight = parseFloat(document.getElementById('totalWeight').value);
        const tRatio = parseFloat(document.getElementById('targetRatio').value);
        
        let values = [v1, v2, v3].filter(v => !isNaN(v));
        
        if (values.length === 0 || isNaN(tWeight) || isNaN(tRatio)) {
            alert("請檢查固含量、總重量與目標比例是否已輸入");
            return;
        }

        const avgSolid = values.reduce((a, b) => a + b, 0) / values.length;
        const C = avgSolid / 100;
        const P_target = tRatio / 100; 

        if (C <= P_target) {
            alert("錯誤：平均固含量必須大於目標比例 (" + tRatio + "%)");
            return;
        }

        const powder = (P_target * tWeight) / C;
        const water = tWeight - powder;

        document.getElementById('avgSolid').innerText = avgSolid.toFixed(3) + " % (" + values.length + "筆)";
        document.getElementById('outputPowder').innerText = powder.toFixed(4) + " kg";
        document.getElementById('outputWater').innerText = water.toFixed(4) + " kg";
        
        document.getElementById('resultBox').style.display = 'block';
    }

    function resetForm() {
        document.getElementById('sc1').value = '';
        document.getElementById('sc2').value = '';
        document.getElementById('sc3').value = '';
        document.getElementById('totalWeight').value = '10';
        document.getElementById('targetRatio').value = '2.3';
        document.getElementById('resultBox').style.display = 'none';
    }
</script>

</body>
</html>
