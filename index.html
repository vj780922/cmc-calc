<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漿料配比與含水物計算機 - SJ</title>
    <style>
        /* 字型設定：英文 Calibri, 中文 微軟正黑體 */
        body {
            font-family: "Calibri", "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f9;
            color: #2d3748;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 35px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #1a365d;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .section-label {
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
            color: #3182ce;
            border-left: 4px solid #3182ce;
            padding-left: 10px;
        }

        .input-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .input-group label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
            display: block;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            font-family: "Calibri", "Microsoft JhengHei";
        }

        input[type="number"]:focus, select:focus {
            border-color: #3182ce;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2c5282;
        }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 12px;
            border: 1px solid #bee3f8;
            display: none;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .final-val {
            font-size: 18px;
            font-weight: bold;
            color: #2b6cb0;
            border-top: 2px dashed #90cdf4;
            padding-top: 15px;
            margin-top: 15px;
            flex-direction: column;
            align-items: flex-start;
        }

        .final-val div {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .highlight-text {
            color: #e53e3e;
            font-size: 22px;
        }

        .footer-info {
            text-align: center;
            font-size: 13px;
            color: #718096;
            line-height: 2;
        }

        .visit-badge {
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #4a5568;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>漿料配比與含水物計算機</h2>

        <!-- 期望目標設定 -->
        <span class="section-label">期望目標設定</span>
        <div class="input-row" style="grid-template-columns: repeat(2, 1fr);">
            <div class="input-group">
                <label>目標總重量 (kg)</label>
                <input type="number" id="targetTotalWeight" step="0.1" value="10" placeholder="10.0">
            </div>
            <div class="input-group">
                <label>目標固含量 (%)</label>
                <input type="number" id="targetPercent" step="0.01" value="59.33" placeholder="59.33">
            </div>
        </div>

        <!-- 原料添加量輸入 (第一組) -->
        <span class="section-label">原料添加量 (kg) - 固體類</span>
        <div class="input-row">
            <div class="input-group">
                <label>N58-30K (99.67%)</label>
                <input type="number" id="w_n58" step="0.0001" placeholder="0.0000" value="6.2800">
            </div>
            <div class="input-group">
                <label>Super P (99.29%)</label>
                <input type="number" id="w_sp" step="0.0001" placeholder="0.0000" value="0.1850">
            </div>
            <div class="input-group">
                <label>SBR (45.65%)</label>
                <input type="number" id="w_sbr" step="0.0001" placeholder="0.0000" value="0.1470">
            </div>
        </div>

        <!-- 原料添加量輸入 (第二組) -->
        <span class="section-label">原料添加量 (kg) - 液體/分散類</span>
        <div class="input-row">
            <div class="input-group">
                <label>BD_C23 (2.37%)</label>
                <input type="number" id="w_bd" step="0.0001" placeholder="0.0000" value="2.7800">
            </div>
            <div class="input-group">
                <label>SWCNT (0.85%)</label>
                <input type="number" id="w_swcnt" step="0.0001" placeholder="0.0000" value="0.5500">
            </div>
            <div class="input-group">
                <label>RO水 (0.00%)</label>
                <input type="number" id="w_ro" step="0.0001" placeholder="0.0000" value="1.1500">
            </div>
        </div>

        <!-- 調節原料選擇 -->
        <span class="section-label">調節參數</span>
        <div class="input-group" style="margin-bottom: 25px;">
            <label>欲用來補足/調節的原料</label>
            <select id="adjustMaterial">
                <option value="RO水">RO水 (0.00%)</option>
                <option value="N58-30K">N58-30K (99.67%)</option>
                <option value="Super P">Super P (99.29%)</option>
                <option value="BD_C23">BD_C23 (2.37%)</option>
                <option value="SWCNT">SWCNT (0.85%)</option>
                <option value="SBR">SBR (45.65%)</option>
            </select>
        </div>

        <button onclick="calculate()">執行計算</button>

        <!-- 結果顯示區域 -->
        <div id="resultBox" class="result-area">
            <div class="result-line">
                <span>目前實際總重量：</span>
                <span id="resTotalWeight">-</span>
            </div>
            <div class="result-line">
                <span>目前實際總固重：</span>
                <span id="resTotalSolid">-</span>
            </div>
            <div class="result-line">
                <span>目前總含水量 (%)：</span>
                <span id="resWaterPercent">-</span>
            </div>
            <div class="result-line">
                <span>目前總固含量 (%)：</span>
                <span id="resSolidPercent">-</span>
            </div>
            
            <div class="result-line final-val">
                <div>
                    <span>需補足 <strong id="resAdjustName" style="color:#1a365d;">-</strong> 重量：</span>
                    <span id="resNeededWeight" class="highlight-text">-</span>
                </div>
                <div style="font-size: 12px; color: #718096; font-weight: normal; margin-top: 5px;">
                    <span>補足後預計最終固含量：</span>
                    <span id="resFinalSolidPercent">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾資訊與次數統計 -->
    <div class="footer-info">
        <div>作者：SJ | 版本：v2.0 | 最後更新日期：2026/05/18</div>
        <div>拜訪次數：<span class="visit-badge" id="visitCount">0</span></div>
    </div>
</div>

<script>
    // 原材料固含量定義資料庫
    const db = {
        "N58-30K": 99.67,
        "Super P": 99.29,
        "BD_C23": 2.37,
        "SWCNT": 0.85,
        "RO水": 0.00,
        "SBR": 45.65
    };

    // 網頁載入時執行：紀錄並讀取拜訪次數
    window.onload = function() {
        let count = localStorage.getItem('sj_slurry_calc_visits') || 0;
        count = parseInt(count) + 1;
        localStorage.setItem('sj_slurry_calc_visits', count);
        document.getElementById('visitCount').innerText = count;
    };

    // 四捨五入精確計算函數
    function roundTo(num, decimals) {
        return Math.round((num + Number.EPSILON) * Math.pow(10, decimals)) / Math.pow(10, decimals);
    }

    // 核心計算邏輯
    function calculate() {
        // 讀取各欄位輸入數值 (若空白則視為 0)
        const inputs = {
            "N58-30K": parseFloat(document.getElementById('w_n58').value) || 0,
            "Super P": parseFloat(document.getElementById('w_sp').value) || 0,
            "BD_C23":  parseFloat(document.getElementById('w_bd').value) || 0,
            "SWCNT":   parseFloat(document.getElementById('w_swcnt').value) || 0,
            "RO水":    parseFloat(document.getElementById('w_ro').value) || 0,
            "SBR":     parseFloat(document.getElementById('w_sbr').value) || 0
        };

        let currentTotalWeight = 0;
        let currentTotalSolidWeight = 0;

        // 計算目前投入的總重與總固重
        Object.keys(inputs).forEach(name => {
            const weight = inputs[name];
            const solidRate = db[name] / 100;
            currentTotalWeight += weight;
            currentTotalSolidWeight += weight * solidRate;
        });

        // 計算目前百分比
        const currentSolidP = currentTotalWeight > 0 ? (currentTotalSolidWeight / currentTotalWeight) * 100 : 0;
        const currentWaterP = 100 - currentSolidP;

        // 讀取反推目標值
        const targetTotalW = parseFloat(document.getElementById('targetTotalWeight').value) || 0;
        const targetSolidP = parseFloat(document.getElementById('targetPercent').value) / 100 || 0;
        const adjustMatName = document.getElementById('adjustMaterial').value;
        const adjustSolidRate = db[adjustMatName] / 100;

        // 計算要達到「目標總重量」，還差多少重量
        let neededWeight = targetTotalW - currentTotalWeight;
        
        // 計算以此調節原料補足到目標總重後，最終的固含量預測值
        let finalPercent = 0;
        if (targetTotalW > 0) {
            const finalSolidWeight = currentTotalSolidWeight + (Math.max(0, neededWeight) * adjustSolidRate);
            finalPercent = (finalSolidWeight / targetTotalW) * 100;
        }

        // 輸出基本摘要資訊 (保留四位小數，百分比保留兩位)
        document.getElementById('resTotalWeight').innerText = currentTotalWeight.toFixed(4) + " kg";
        document.getElementById('resTotalSolid').innerText = currentTotalSolidWeight.toFixed(4) + " kg";
        document.getElementById('resWaterPercent').innerText = currentWaterP.toFixed(2) + " %";
        document.getElementById('resSolidPercent').innerText = currentSolidP.toFixed(2) + " %";
        document.getElementById('resAdjustName').innerText = adjustMatName;

        // 輸出反推結果與防呆機制
        const weightResEl = document.getElementById('resNeededWeight');
        if (neededWeight >= 0) {
            weightResEl.innerText = neededWeight.toFixed(4) + " kg";
            document.getElementById('resFinalSolidPercent').innerText = finalPercent.toFixed(2) + " %";
        } else {
            weightResEl.innerText = "0.0000 kg";
            document.getElementById('resFinalSolidPercent').innerText = "無法計算 (目前總重已超過目標值)";
        }

        // 展開結果區塊
        document.getElementById('resultBox').style.display = 'block';
    }
</script>
</body>
</html>
